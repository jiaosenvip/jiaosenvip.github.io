<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网址导航</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f5; }
    #restoreStatus {
      position: fixed; inset: 0;
      display: grid; place-items: center; background: rgba(255,255,255,.88);
      color: #666; font-size: 14px; letter-spacing: .04em;
      z-index: 20;
    }
    .spinner { width: 18px; height: 18px; border: 2px solid #eee; border-top-color: #c00; border-radius: 50%; display:inline-block; animation: spin .8s linear infinite; margin-right: 10px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="restoreStatus"><span class="spinner"></span>正在恢复首页内容…</div>
  <script>
    (function () {
      const previousUrl = 'https://raw.githubusercontent.com/jiaosenvip/jiaosenvip.github.io/4a76a391ab6905610b4b8eb71cc03fa42f8ee563/index.html';
      const status = document.getElementById('restoreStatus');

      function restoreFromHTML(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const body = doc.body;
        if (!body) return;

        const fragment = document.createDocumentFragment();
        while (document.body.firstChild) {
          fragment.appendChild(document.body.firstChild);
        }
        document.body.innerHTML = '';
        document.body.appendChild(fragment);

        const container = document.createElement('div');
        container.innerHTML = body.innerHTML;
        document.body.appendChild(container);

        Array.from(doc.querySelectorAll('script')).forEach((script) => {
          const newScript = document.createElement('script');
          if (script.src) {
            newScript.src = script.src;
          } else {
            newScript.textContent = script.textContent;
          }
          document.body.appendChild(newScript);
        });

        if (status) status.remove();
      }

      fetch(previousUrl)
        .then((response) => {
          if (!response.ok) throw new Error('backup fetch failed');
          return response.text();
        })
        .then(restoreFromHTML)
        .catch(() => {
          if (status) {
            status.textContent = '恢复失败，正在回退到简版导航…';
          }
          document.body.innerHTML = '<main style="max-width:960px;margin:40px auto;padding:20px;font-family:sans-serif;color:#333;line-height:1.8;"><h1>网址导航</h1><p>恢复失败，请稍后刷新。</p></main>';
        });
    })();
  </script>
</body>
</html>
