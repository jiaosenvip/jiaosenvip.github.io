<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:;" />
  <title>恢复中...</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-radius: 12px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid #e6e6e6; border-top-color: #d00;
      border-radius: 50%; display: inline-block; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box"><span class="spinner"></span><span>正在恢复上一个可用首页…</span></div>
  <script>
    (function () {
      const lastKnownGood = 'https://raw.githubusercontent.com/jiaosenvip/jiaosenvip.github.io/4a76a391ab6905610b4b8eb71cc03fa42f8ee563/index.html';

      fetch(lastKnownGood, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('fetch failed');
          return response.text();
        })
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const oldDoc = doc.documentElement;
          if (!oldDoc) throw new Error('no html');
          document.documentElement.innerHTML = oldDoc.innerHTML;

          const scripts = Array.from(doc.querySelectorAll('script'));
          scripts.forEach((script) => {
            const newScript = document.createElement('script');
            if (script.src) {
              newScript.src = script.src;
            } else {
              newScript.textContent = script.textContent;
            }
            document.body.appendChild(newScript);
          });
        })
        .catch(() => {
          document.body.innerHTML = '<main style="max-width:960px;margin:60px auto;padding:20px;font-family:sans-serif;color:#333;line-height:1.8;">' +
            '<h1>网址导航</h1>' +
            '<p>恢复失败，请稍后刷新。</p>' +
            '<p>如果仍然失败，请手动切回 <code>4a76a391ab6905610b4b8eb71cc03fa42f8ee563</code> 版本。</p>' +
            '</main>';
        });
    })();
  </script>
</body>
</html>
