<body>
<div class="app">
<header class="top"><div class="brand"><span class="mark">山</span>5A景区打卡地图 <span style="font-size:12px;color:#85909a;font-weight:400">国家5A级旅游景区</span></div><div class="top-note">打卡记录保存在当前浏览器 · 可生成分享长图</div></header>
<div class="layout"><aside class="side"><p class="nav-label">工作台</p><div class="nav"><button class="active">景区总览</button><button onclick="document.getElementById('list').scrollIntoView({behavior:'smooth'})">我的清单</button><button onclick="resetData()">重置打卡</button></div><div class="legend"><p><span class="dot" style="background:#cf4f38"></span>已打卡景区</p><p><span class="dot" style="background:#87939b"></span>待探索景区</p><p>提示：点击表格中的“打卡”即可在地图中显示。</p></div></aside>
<main class="main"><div class="headrow"><div><h1>走过山河，留下坐标</h1><p class="sub">文化和旅游部官方全量 5A 景区名录，共 375 家；数据截至 2026-11-11。</p></div><div class="stats"><div class="stat"><b id="doneCount">0</b><span>已打卡</span></div><div class="stat"><b id="totalCount">0</b><span>收录景区</span></div><div class="stat"><b id="fiveCount">0</b><span>5A 完成</span></div><div class="stat"><b id="provinceCount">0</b><span>到访省份</span></div></div></div>
<section class="map-panel"><div class="map-toolbar">地图中展示 <b id="mapCount">0</b> 个已打卡景区</div><div id="map"><div class="map-fallback">正在加载腾讯地图…</div></div></section>
<section id="list"><div class="controls"><div class="filters"><button class="filter active" data-filter="all">全部景区</button><button class="filter" data-filter="done">已打卡</button><button class="filter" data-filter="todo">待探索</button></div><div class="actions"><input id="search" class="search" placeholder="搜索景区或省份"><button id="shareMap" class="text-btn">分享地图</button><button id="exportData" class="text-btn">导出记录</button><button id="importData" class="text-btn" type="button">导入记录</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></div><div class="table-wrap"><table class="attractions"><thead><tr><th>景区</th><th>等级</th><th>省份</th><th>主题</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有符合条件的景区</div></div></section>
</main></div></div><div id="notice" class="notice"></div>
<div id="sharePreview" class="share-preview-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="sharePreviewTitle">

    <h3 id="sharePreviewTitle">分享「我的 5A 景区打卡地图」</h3>

    <div class="actions">
      <button id="sharePreviewClose" type="button">关闭</button>
      <button id="sharePreviewSave" type="button" class="primary">保存为 PNG</button>
    </div>
  </div>
</div>
