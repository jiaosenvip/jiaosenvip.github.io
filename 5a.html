const storageKey = 'fivea-checkins-v2';
const shareParam = 'spots';
let shareMode = false;

function decodeShare(value) {
  if (!value) return null;
  try {
    return new Set(
      atob(value)
        .split(',')
        .map(Number)
        .filter(id => Number.isInteger(id) && id >= 0 && id < spots.length)
    );
  } catch (e) {
    return null;
  }
}

function loadChecked() {
  const shared = decodeShare(new URLSearchParams(location.search).get(shareParam) || '');
  if (shared) {
    shareMode = true;
    return shared;
  }
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    return new Set(saved.filter(id => Number.isInteger(id) && id >= 0 && id < spots.length));
  } catch (e) {
    return new Set();
  }
}

let checked = loadChecked();
let filter = 'all';
let query = '';
let map = null;
let markers = null;
let geocodeQueue = [];

function save() {
  if (!shareMode) localStorage.setItem(storageKey, JSON.stringify([...checked]));
}

function show(msg) {
  const n = document.getElementById('notice');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(show._t);
  show._t = setTimeout(() => n.classList.remove('show'), 2000);
}

function filtered() {
  const q = query.trim().toLowerCase();
  return spots.filter(s => {
    const hitQ = !q ||
      (s.name + s.province + s.type).toLowerCase().includes(q);
    const hitF = filter === 'all' ||
      (filter === 'done' && checked.has(s.id)) ||
      (filter === 'todo' && !checked.has(s.id));
    return hitQ && hitF;
  });
}

function render() {
  const list = filtered();
  const rows = document.getElementById('rows');
  rows.innerHTML = list.map(s => {
    const yes = checked.has(s.id);
    const button = shareMode
      ? '<span style="color:#697582;font-size:12px">分享视图</span>'
      : `<button class="check ${yes ? 'undo' : ''}" data-checkin-id="${s.id}">${yes ? '撤销' : '打卡'}</button>`;
    return `<tr>
      <td><div class="name">${s.name}</div><div class="city">${s.province}</div></td>
      <td><span class="grade a5">5A</span></td>
      <td>${s.province}</td>
      <td>${s.type}</td>
      <td><span class="tag ${yes ? 'done' : 'todo'}">${yes ? '已打卡' : '待探索'}</span></td>
      <td>${button}</td>
    </tr>`;
  }).join('');
  document.getElementById('empty').hidden = list.length > 0;
  document.getElementById('doneCount').textContent = checked.size;
  document.getElementById('totalCount').textContent = spots.length;
  document.getElementById('fiveCount').textContent = checked.size;
  document.getElementById('provinceCount').textContent =
    new Set([...checked].map(id => spots[id] && spots[id].province).filter(Boolean)).size;
  document.getElementById('mapCount').textContent =
    spots.filter(s => checked.has(s.id) && Number.isFinite(s.lat) && Number.isFinite(s.lng)).length;
  renderMarkers();
}

function toggle(id) {
  if (shareMode) return;
  const s = spots[id];
  if (!s) return;
  if (checked.has(id)) {
    checked.delete(id);
    show('已撤销「' + s.name + '」');
  } else {
    checked.add(id);
    show('已打卡「' + s.name + '」');
    resolveLocation(s);
  }
  save();
  render();
}

function resolveLocation(s) {
  // Already has coordinates → nothing to do.
  if (!Number.isFinite(s.lat) || !Number.isFinite(s.lng)) return;
  // Map not ready yet → retry next render() call.
  if (!map || !window.TMap || !TMap.MultiMarker) {
    render();
    return;
  }
  renderMarkers();
}

function renderMarkers() {
  if (!map || !window.TMap || !TMap.MultiMarker) return;
  const list = spots.filter(
    s => checked.has(s.id) && Number.isFinite(s.lat) && Number.isFinite(s.lng)
  );
  const geometries = list.map(s => ({
    id: String(s.id),
    styleId: 'spot',
    position: new TMap.LatLng(s.lat, s.lng),
    properties: { title: s.name }
  }));
  if (markers) {
    markers.setGeometries(geometries);
  } else {
    markers = new TMap.MultiMarker({
      map,
      styles: {
        spot: new TMap.MarkerStyle({
          width: 26,
          height: 34,
          anchor: { x: 13, y: 32 },
          src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34">'
            + '<path fill="#cf4f38" d="M13 0C6 0 1 5 1 12c0 9 12 22 12 22s12-13 12-22C25 5 20 0 13 0z"/>'
            + '<circle cx="13" cy="12" r="5" fill="white"/></svg>'
          )
        })
      },
      geometries
    });
  }
  if (list.length === 0) {
    map.setCenter(new TMap.LatLng(35.8617, 104.1954));
    map.setZoom(4);
  } else if (list.length === 1) {
    map.setCenter(new TMap.LatLng(list[0].lat, list[0].lng));
  } else if (list.length > 1) {
    const b = new TMap.LatLngBounds();
    list.forEach(s => b.extend(new TMap.LatLng(s.lat, s.lng)));
    map.fitBounds(b, { padding: 70 });
  }
}

function initMap() {
  const fallback = document.getElementById('map');
  let attempts = 0;
  function poll() {
    if (window.TMap && TMap.Map && TMap.LatLng && TMap.MultiMarker) {
      fallback.innerHTML = '';
      map = new TMap.Map('map', {
        center: new TMap.LatLng(35.8617, 104.1954),
        zoom: 4,
        minZoom: 3,
        maxZoom: 15,
        renderOptions: {
          preserveDrawingBuffer: true // allow screenshot for share card
        }
      });
      render();
    } else if (attempts < 50) {
      attempts++;
      setTimeout(poll, 200);
    } else {
      fallback.innerHTML = '<div class="map-fallback">地图服务暂不可用；打卡记录仍可正常保存</div>';
    }
  }
  poll();
}

function resetData() {
  if (shareMode) { show('分享视图为只读模式'); return; }
  if (confirm('确定清空全部打卡记录吗？')) {
    checked.clear();
    save();
    render();
    show('打卡记录已清空');
  }
}

function exportData() {
  const data = spots.filter(s => checked.has(s.id)).map(s => ({
    景区: s.name, 等级: '5A', 省份: s.province
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = '5A景区打卡记录.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  show('已导出 ' + data.length + ' 条记录');
}

async function importData(file) {
  if (shareMode) { show('分享视图为只读模式'); return; }
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    const records = Array.isArray(parsed) ? parsed : parsed && (parsed.records || parsed.data);
    if (!Array.isArray(records)) throw new Error('文件格式不正确，应为景区记录 JSON 数组');

    const normalize = value => String(value == null ? '' : value).trim().replace(/\s+/g, '');
    const byName = new Map(spots.map(s => [normalize(s.name), s]));
    const byNameProvince = new Map(spots.map(s => [normalize(s.name) + '|' + normalize(s.province), s]));
    const importedIds = new Set();
    let ignored = 0;
    records.forEach(record => {
      // 兼容本项目导出的“景区/省份”格式，也兼容英文 name/province 字段。
      if (typeof record === 'number' || (typeof record === 'string' && /^\\d+$/.test(record))) {
        const id = Number(record);
        if (Number.isInteger(id) && id >= 0 && id < spots.length) importedIds.add(id);
        else ignored++;
        return;
      }
      if (!record || typeof record !== 'object') { ignored++; return; }
      const name = record['景区'] || record.name || record.title || record['景区名称'];
      const province = record['省份'] || record.province || '';
      const match = byNameProvince.get(normalize(name) + '|' + normalize(province)) || byName.get(normalize(name));
      if (match) importedIds.add(match.id);
      else ignored++;
    });

    const before = checked.size;
    importedIds.forEach(id => checked.add(id));
    const added = checked.size - before;
    save();
    render();
    const suffix = ignored ? '，忽略 ' + ignored + ' 条无法匹配记录' : '';
    show('已导入 ' + added + ' 条新记录' + suffix);
  } catch (err) {
    show('导入失败：' + (err && err.message || 'JSON 文件无法读取'));
  }
}

async function captureCompliantMapSnapshot(width, height) {
  const id = 'shareMapCapture_' + Date.now();
  const holder = document.createElement('div');
  holder.id = id;
  holder.style.cssText = [
    'position:fixed', 'left:-20000px', 'top:0',
    'width:' + width + 'px', 'height:' + height + 'px',
    'opacity:1', 'pointer-events:none', 'overflow:hidden', 'background:#eaf0ec'
  ].join(';');
  document.body.appendChild(holder);
  let snapMap = null;
  try {
    snapMap = new TMap.Map(id, {
      center: new TMap.LatLng(35.8617, 104.1954),
      zoom: 4,
      minZoom: 3,
      maxZoom: 15,
      renderOptions: { preserveDrawingBuffer: true }
    });
    // Let Tencent Maps fit the full China extent instead of guessing center/zoom.
    // Bounds include mainland, Taiwan, Hainan and South China Sea area.
    const chinaBounds = new TMap.LatLngBounds();
    chinaBounds.extend(new TMap.LatLng(3.5, 73.0));
    chinaBounds.extend(new TMap.LatLng(54.0, 136.0));
    if (typeof snapMap.fitBounds === 'function') snapMap.fitBounds(chinaBounds, { padding: 22 });
    const checkedSpots = spots.filter(s => checked.has(s.id) && Number.isFinite(s.lat) && Number.isFinite(s.lng));
    if (checkedSpots.length) {
      new TMap.MultiMarker({
        map: snapMap,
        styles: {
          spot: new TMap.MarkerStyle({
            width: 28,
            height: 36,
            anchor: { x: 14, y: 34 },
            src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36">'
              + '<path fill="#cf4f38" d="M14 0C6.5 0 1 5.6 1 13c0 9.5 13 23 13 23s13-13.5 13-23C27 5.6 21.5 0 14 0z"/>'
              + '<circle cx="14" cy="13" r="5.5" fill="white"/></svg>'
            )
          })
        },
        geometries: checkedSpots.map(s => ({
          id: 'share-' + s.id,
          styleId: 'spot',
          position: new TMap.LatLng(s.lat, s.lng),
          properties: { title: s.name }
        }))
      });
    }
    // Wait enough for Tencent vector basemap + marker layer to paint.
    await new Promise(r => setTimeout(r, 1800));
    const canvas = holder.querySelector('canvas');
    if (!canvas) throw new Error('地图截图画布未生成');
    const dataUrl = canvas.toDataURL('image/png');
    if (!dataUrl || dataUrl.length < 20000) throw new Error('地图截图内容为空，请稍后重试');
    return dataUrl;
  } finally {
    try { if (snapMap && typeof snapMap.destroy === 'function') snapMap.destroy(); } catch (e) {}
    holder.remove();
  }
}

async function shareMap() {
  try {
    if (!map || !window.TMap) { show('分享失败：地图尚未初始化'); return; }
    show('正在生成合规地图分享图…');
    // 使用离屏腾讯地图实例生成专用截图，避免把页面宽屏地图硬塞进竖版分享图。
    const baseMapDataUrl = await captureCompliantMapSnapshot(1180, 900);
    const card = await buildShareCard(baseMapDataUrl);
    if (!card) { show('分享失败：卡片构建错误'); return; }
    const ids = [...checked];
    const ts = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = ts.getFullYear() + pad(ts.getMonth()+1) + pad(ts.getDate()) + '-' + pad(ts.getHours()) + pad(ts.getMinutes());
    const filename = '5A打卡地图-' + stamp + '.png';
    if (typeof window.__openSharePreview === 'function') {
      window.__openSharePreview(card.toDataURL('image/png'), filename);
      show('已生成 ' + ids.length + ' / ' + spots.length + ' 家打卡长图 · 点保存下载');
    } else {
      const a = document.createElement('a');
      a.download = filename;
      a.href = card.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      show('已导出 ' + ids.length + ' / ' + spots.length + ' 家打卡 PNG');
    }
  } catch (err) {
    show('分享失败：' + (err && err.message || err));
  }
}

async function buildShareCard(baseMapDataUrl) {
  // 省份名美化：去掉"自治区/省/市/特别行政区"等后缀，并补常用简称。
  const PROVINCE_LABEL = {
    '北京': '北京', '天津': '天津', '上海': '上海', '重庆': '重庆',
    '河北': '河北', '山西': '山西', '辽宁': '辽宁', '吉林': '吉林', '黑龙江': '黑龙江',
    '江苏': '江苏', '浙江': '浙江', '安徽': '安徽', '福建': '福建', '江西': '江西',
    '山东': '山东', '河南': '河南', '湖北': '湖北', '湖南': '湖南', '广东': '广东',
    '海南': '海南', '四川': '四川', '贵州': '贵州', '云南': '云南', '陕西': '陕西',
    '甘肃': '甘肃', '青海': '青海', '内蒙古': '内蒙古', '广西': '广西', '西藏': '西藏',
    '宁夏': '宁夏', '新疆': '新疆',
    '香港': '中国香港', '澳门': '中国澳门', '台湾': '中国台湾',
    '新疆维吾尔自治区': '新疆', '广西壮族自治区': '广西', '宁夏回族自治区': '宁夏',
    '内蒙古自治区': '内蒙古', '西藏自治区': '西藏', '香港特别行政区': '中国香港',
    '澳门特别行政区': '中国澳门'
  };

  const W = 1080, H = 1900;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // 1) Background.
  ctx.fillStyle = '#f6f8f7';
  ctx.fillRect(0, 0, W, H);

  // 2) Brand header.
  const pad = 50;
  ctx.fillStyle = '#cf4f38';
  ctx.fillRect(pad, pad, 72, 72);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 50px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('山', pad + 36, pad + 36);
  ctx.fillStyle = '#17212b';
  ctx.textAlign = 'left';
  ctx.font = 'bold 50px "Microsoft YaHei",sans-serif';
  ctx.fillText('5A 景区打卡地图', pad + 96, pad + 46);
  ctx.fillStyle = '#697582';
  ctx.font = '22px "Microsoft YaHei",sans-serif';
  ctx.fillText('国家 5A 级旅游景区 · 共 ' + spots.length + ' 家', pad + 98, pad + 96);

  // 3) Big stats row.
  const checkedCount = checked.size;
  const coverage = spots.length ? ((checkedCount / spots.length) * 100).toFixed(1) : '0.0';
  const stats = [
    { lbl: '已打卡', val: checkedCount },
    { lbl: '收录', val: spots.length },
    { lbl: '覆盖率', val: coverage + '%' }
  ];
  const sgap = 18;
  const sw = (W - pad * 2 - sgap * 2) / 3;
  const sh = 120;
  let sx = pad;
  const statsY = 240;
  stats.forEach((s) => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, statsY, sw, sh);
    ctx.strokeStyle = '#d9e0e5';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, statsY + 0.5, sw - 1, sh - 1);
    ctx.fillStyle = '#697582';
    ctx.font = '22px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(s.lbl, sx + 22, statsY + 32);
    ctx.fillStyle = '#17212b';
    ctx.font = 'bold 54px "Microsoft YaHei",sans-serif';
    ctx.fillText(String(s.val), sx + 22, statsY + 92);
    sx += sw + sgap;
  });

  // 4) Map panel: paste the official Tencent map screenshot as the compliant base map.
  const mapX = pad, mapY = 400, mapW = W - pad * 2, mapH = 750;
  ctx.save();
  ctx.fillStyle = '#eef3f0';
  ctx.fillRect(mapX, mapY, mapW, mapH);
  ctx.strokeStyle = '#d9e0e5';
  ctx.lineWidth = 1;
  ctx.strokeRect(mapX + 0.5, mapY + 0.5, mapW - 1, mapH - 1);
  if (baseMapDataUrl) {
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        // Use the official Tencent map screenshot, then crop only harmless outer margins
        // to reduce unrelated neighboring regions. No borders/territory are hand-drawn.
        const sx = img.width * 0.02;
        const sy = img.height * 0.02;
        const sWidth = img.width * 0.96;
        const sHeight = img.height * 0.96;
        ctx.drawImage(img, sx, sy, sWidth, sHeight, mapX, mapY, mapW, mapH);
        resolve();
      };
      img.onerror = () => resolve();
      img.src = baseMapDataUrl;
    });
  } else {
    ctx.fillStyle = '#87939b';
    ctx.font = '20px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('地图底图未加载', mapX + mapW / 2, mapY + mapH / 2);
  }
  ctx.restore();

  // 5) Top checked provinces list (vertical, 2 columns).
  const checkedSpots = spots.filter(s => checked.has(s.id));
  const checkedByProvince = {};
  checkedSpots.forEach(s => { checkedByProvince[s.province] = (checkedByProvince[s.province] || 0) + 1; });
  const provList = Object.entries(checkedByProvince).sort((a,b)=>b[1]-a[1]).slice(0, 16);
  const listY = mapY + mapH + 50;
  ctx.fillStyle = '#17212b';
  ctx.font = 'bold 32px "Microsoft YaHei",sans-serif';
  ctx.fillText('已打卡省份（top 16）', pad, listY + 30);
  ctx.font = '24px "Microsoft YaHei",sans-serif';
  if (provList.length === 0) {
    ctx.fillStyle = '#697582';
    ctx.fillText('尚未打卡任何 5A 景区', pad, listY + 86);
  } else {
    const colW = (W - pad * 2) / 2;
    const rowH = 56;
    provList.forEach(([p, n], i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const x = pad + col * colW;
      const y = listY + 80 + row * rowH;
      ctx.fillStyle = '#cf4f38';
      ctx.fillRect(x, y, 6, 26);
      ctx.fillStyle = '#17212b';
      ctx.textBaseline = 'top';
      ctx.fillText((PROVINCE_LABEL[p] || p.replace(/(自治区|省|市|特别行政区|维吾尔|壮族|回族)/g, '')) + ' · ' + n + ' 家', x + 18, y);
    });
    ctx.textBaseline = 'alphabetic';
  }

  // 6) Footer.
  ctx.fillStyle = '#87939b';
  ctx.font = '20px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('数据：文化和旅游部官方全量 5A 景区名录（截至 2025-03-11，共 358 家） · 底图：腾讯地图官方矢量地图', pad, H - 110);
  ctx.fillText('本图由「5A 景区打卡地图」生成于 ' + new Date().toLocaleString('zh-CN', { hour12: false }), pad, H - 76);
  return c;
}

document.getElementById('rows').addEventListener('click', e => {
  const btn = e.target.closest('[data-checkin-id]');
  if (btn) toggle(Number(btn.dataset.checkinId));
});
document.querySelectorAll('.filter').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelector('.filter.active').classList.remove('active');
    b.classList.add('active');
    filter = b.dataset.filter;
    render();
  });
});
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value || '';
  render();
});
document.getElementById('exportData').addEventListener('click', exportData);
document.getElementById('shareMap').addEventListener('click', shareMap);
const importFile = document.getElementById('importFile');
document.getElementById('importData').addEventListener('click', () => {
  if (shareMode) { show('分享视图为只读模式'); return; }
  importFile.value = '';
  importFile.click();
});
importFile.addEventListener('change', e => importData(e.target.files && e.target.files[0]));
if (shareMode) {
  document.querySelector('.top-note').textContent = '当前为只读分享地图 · 你无法修改原始打卡记录';
  document.querySelector('.side .nav button:last-child').style.display = 'none';
}
initMap();
render();

    <p>下方是按你当前打卡状态生成的长图，保存后即可发到朋友圈、群聊或好友。</p>
    <img id="sharePreviewImg" alt="打卡长图">
    <div class="actions">

      <button id="sharePreviewSave" type="button" class="primary">保存为 PNG</button>

</div>
<script>
(function(){
  var root = document.getElementById('sharePreview');
  var img  = document.getElementById('sharePreviewImg');
  var save = document.getElementById('sharePreviewSave');
  var closeBtn = document.getElementById('sharePreviewClose');
  function show(dataUrl, filename) {
    img.src = dataUrl;
    root.dataset.filename = filename || '5A打卡地图.png';
    root.classList.remove('hidden');
  }
  function hide() { root.classList.add('hidden'); }
  closeBtn.addEventListener('click', hide);
  root.addEventListener('click', function(e){ if (e.target === root) hide(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });
  save.addEventListener('click', function() {
    var a = document.createElement('a');
    a.download = root.dataset.filename || '5A打卡地图.png';
    a.href = img.src;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
  window.__openSharePreview = show;
})();
</script>
