<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="Shortcut Icon" type="image/x-icon" href="/github.png" />
  <title>RSS 阅读器</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-2: #0ea5e9;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #020617, #0f172a 20%, #111827 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1480px, calc(100vw - 24px));
      margin: 12px auto 20px;
      display: grid;
      gap: 12px;
      min-width: 0;
      align-items: start;
    }

    .topbar {
      position: relative;
      display: grid;
      gap: 12px;
      align-items: start;
    }

    .hero-panel {
      padding: 18px 22px;
    }

    .hero-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .hero-desc {
      max-width: 980px;
      font-size: 15px;
      line-height: 1.7;
    }

    .management-anchor {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 20;
    }

    .management-toggle {
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.24);
      color: #e2e8f0;
      box-shadow: 0 16px 36px rgba(2, 6, 23, 0.26);
    }

    .management-toggle.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.32), rgba(56, 189, 248, 0.28));
      border-color: rgba(56, 189, 248, 0.42);
      color: #fff;
    }

    .management-popover {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: min(560px, calc(100vw - 32px));
      padding: 0;
      display: none;
      overflow: hidden;
    }

    .management-popover.open {
      display: block;
    }

    .management-grid {
      display: grid;
      grid-template-columns: 1fr;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(250px, 300px) minmax(0, 1fr);
      gap: 14px;
      min-width: 0;
      align-items: start;
    }

    .panel {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
    }

    .sidebar {
      align-self: start;
    }

    .tab-panel {
      position: sticky;
      top: 12px;
      align-self: start;
      height: calc(100vh - 24px);
      max-height: calc(100vh - 24px);
      overflow: hidden;
    }

    .section {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .section:last-child {
      border-bottom: 0;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-title {
      font-weight: 700;
      font-size: 16px;
      margin: 0;
    }

    .collapse-toggle {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(148, 163, 184, 0.18);
      color: #cbd5e1;
      padding: 8px 10px;
      border-radius: 10px;
      min-width: 44px;
    }

    .collapsible-body {
      display: grid;
      gap: 0;
    }

    .section.collapsed {
      display: none;
    }

    .section.collapsed .collapsible-body {
      display: none;
    }

    .section.collapsed .section-title-row {
      margin-bottom: 0;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }

    .desc,
    .small,
    .status,
    .meta,
    .empty {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      font-size: 13px;
    }

    .status.error {
      color: #fca5a5;
    }

    .status.ok {
      color: #86efac;
    }

    .toolbar,
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .toolbar {
      margin-top: 14px;
    }

    button {
      border: 1px solid transparent;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.08);
    }

    button.primary {
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: #03111d;
      font-weight: 700;
    }

    button.danger {
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.22);
    }

    button.ghost {
      background: transparent;
      border-color: var(--border);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input[type="text"],
    textarea {
      width: 100%;
      margin-top: 8px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.65);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
      max-width: 100%;
      min-width: 0;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    input[type="file"] {
      display: none;
    }

    .tab-panel {
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 36px);
      overflow: hidden;
      min-width: 0;
    }

    .tabs-wrap {
      padding: 12px;
      background: rgba(2, 6, 23, 0.22);
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .tabs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .tabs-title {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .tabs-count {
      font-size: 12px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 4px;
      min-height: 0;
      flex: 0 0 auto;
      max-height: calc(4 * 64px + 3 * 8px);
      scrollbar-width: thin;
    }

    .tab {
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.72));
      color: #dbeafe;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      text-align: left;
      position: relative;
      box-shadow: 0 8px 18px rgba(2, 6, 23, 0.16);
      user-select: none;
      cursor: pointer;
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.22), rgba(56, 189, 248, 0.28));
      border-color: rgba(56, 189, 248, 0.45);
      color: white;
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.18);
    }

    .tab.drag-armed {
      border-style: dashed;
      border-color: rgba(125, 211, 252, 0.55);
      transform: translateY(-2px);
    }

    .tab.dragging {
      opacity: 0.35;
    }

    .tab.drop-target {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.12) inset;
    }

    .tab-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex: 0 0 auto;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(125, 211, 252, 0.12);
    }

    .tab-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .tab-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .tab-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-sub {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-actions {
      display: none;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex: 0 0 auto;
    }

    .tab.show-actions .tab-actions {
      display: inline-flex;
    }

    .tab-action-btn {
      padding: 5px 8px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #cbd5e1;
      box-shadow: none;
      position: relative;
      z-index: 2;
    }

    .tab-action-btn:hover {
      border-color: rgba(125, 211, 252, 0.45);
      color: #f8fafc;
    }

    .tab-action-btn.danger {
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.28);
      background: rgba(127, 29, 29, 0.22);
    }

    .tab-summary {
      border-style: solid;
      background: rgba(15, 23, 42, 0.9);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      font-size: 12px;
      padding: 0 6px;
      background: rgba(148, 163, 184, 0.18);
      color: #cbd5e1;
      flex: 0 0 auto;
    }

    .tab-hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .content-head {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .content-head h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .feed-url {
      font-size: 13px;
      color: #7dd3fc;
      text-decoration: none;
      word-break: break-all;
    }

    .feed-url:hover {
      text-decoration: underline;
    }

    .items {
      padding: 18px;
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.52));
      min-width: 0;
      box-shadow: 0 10px 24px rgba(2, 6, 23, 0.16);
      position: relative;
      overflow: hidden;
    }

    .item::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.95), rgba(14, 165, 233, 0.2));
      border-radius: 18px 0 0 18px;
    }

    .item h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .item h3 a {
      text-decoration: none;
    }

    .item h3 a:hover {
      text-decoration: underline;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .summary {
      color: #d1d5db;
      line-height: 1.7;
      font-size: 14px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.32);
      border: 1px solid rgba(148, 163, 184, 0.12);
      color: #dbeafe;
      font-size: 13px;
    }

    .empty {
      padding: 42px 18px 50px;
      text-align: center;
      font-size: 15px;
    }

    .hint-box {
      border: 1px dashed rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 12px;
      background: rgba(2, 6, 23, 0.2);
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.65;
    }

    @media (max-width: 640px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .management-anchor {
        position: static;
      }

      .management-popover {
        position: static;
        width: 100%;
        margin-top: 12px;
      }

      .tab-panel {
        position: static;
        height: auto;
        max-height: none;
      }

      .tabs {
        max-height: 320px;
      }

      .hero-panel {
        padding: 18px 16px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <section class="panel hero-panel">
        <div class="hero-row">
          <h1>RSS 阅读器</h1>
          <div class="desc hero-desc">每个数据源一个 Tab，支持内置源、用户自定义源、本地缓存持久化、导入导出。左侧查看订阅列表，右侧专注阅读文章内容。</div>
          <div id="globalStatus" class="status"></div>
        </div>
      </section>

      <div class="management-anchor">
        <button class="management-toggle" id="manageToggleBtn" aria-expanded="false">管理</button>
        <section class="panel management-popover" id="managementPopover">
          <div class="management-grid">
            <div class="section">
              <div class="section-title-row">
                <div class="section-title">管理</div>
              </div>
              <div class="toolbar">
                <button class="ghost" id="restoreBtn">恢复默认数据源</button>
                <button class="ghost" id="toggleAddSourceBtn" aria-expanded="false">新增数据源</button>
                <button class="ghost" id="exportBtn">导出数据源</button>
                <button class="ghost" id="importBtn">导入数据源</button>
                <button class="primary" id="refreshAllBtn">刷新全部</button>
                <input type="file" id="importFile" accept="application/json,.json" />
              </div>
            </div>

            <div class="section collapsed" id="addSourceSection">
              <div class="collapsible-body" id="addSourceBody">
                <div class="section-title-row">
                  <div class="section-title">新增数据源</div>
                </div>
                <label>
                  名称
                  <input id="nameInput" type="text" placeholder="例如：少数派" />
                </label>
                <label>
                  RSS 链接
                  <input id="urlInput" type="text" placeholder="https://example.com/feed.xml" />
                </label>
                <div class="action-row">
                  <button class="primary" id="addBtn">添加数据源</button>
                </div>
                <div class="hint-box">
                  新增的数据源会自动保存到浏览器本地缓存，下次打开页面仍然保留。<br />
                  导出/导入的是数据源配置，不是文章内容缓存。
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="workspace">
      <aside class="panel tab-panel">
        <div class="tabs-wrap">
          <div class="tabs-head">
            <div class="tabs-title">订阅列表</div>
            <div class="tabs-count" id="tabsCount"></div>
          </div>
          <div id="tabs" class="tabs"></div>
          <div class="tab-hint">长按订阅卡片可拖拽排序，默认优先展示汇总。</div>
        </div>
      </aside>

      <main class="panel">
        <div class="content-head">
          <div>
            <h2 id="feedTitle">加载中...</h2>
            <a id="feedUrl" class="feed-url" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>
          <div class="small" id="feedMeta"></div>
        </div>
        <div id="items" class="items"></div>
        <div id="emptyState" class="empty" style="display:none;">暂无内容</div>
      </main>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'rss-reader-sources-v1';
    const ACTIVE_KEY = 'rss-reader-active-v1';
    const API_PREFIX = 'https://api.rss2json.com/v1/api.json?rss_url=';
    const BUILTIN_SOURCES = [
      { id: 'oschina', name: '开源中国', url: 'https://www.oschina.net/news/rss' },
      { id: 'ithome', name: 'IT之家', url: 'https://www.ithome.com/rss/' },
      { id: '36kr', name: '36氪', url: 'https://36kr.com/feed' },
      { id: 'sspai', name: '少数派', url: 'https://sspai.com/feed' },
      { id: 'mydrivers', name: '快科技', url: 'https://rss.mydrivers.com/rss.aspx' },
      { id: 'leiphone', name: '雷峰网', url: 'https://www.leiphone.com/feed' },
      { id: 'tmtpost', name: '钛媒体', url: 'https://www.tmtpost.com/rss.xml' },
      { id: 'qbitai', name: '量子位', url: 'https://www.qbitai.com/feed' },
      { id: 'ifanr', name: '爱范儿', url: 'https://www.ifanr.com/feed' },
      { id: 'solidot', name: 'Solidot', url: 'https://www.solidot.org/index.rss' },
      { id: 'hackernews', name: 'Hacker News', url: 'https://hnrss.org/frontpage' },
    ];

    const state = {
      sources: [],
      activeId: '',
      expandedTabActionsId: '',
      itemsById: {},
      loadingById: {},
      errorById: {},
      metaById: {},
    };

    const $ = (id) => document.getElementById(id);
    const tabsEl = $('tabs');
    const itemsEl = $('items');
    const emptyStateEl = $('emptyState');
    const globalStatusEl = $('globalStatus');
    const tabsCountEl = $('tabsCount');
    const feedTitleEl = $('feedTitle');
    const feedUrlEl = $('feedUrl');
    const feedMetaEl = $('feedMeta');
    const nameInputEl = $('nameInput');
    const urlInputEl = $('urlInput');
    const importFileEl = $('importFile');
    const addBtnEl = $('addBtn');
    const refreshAllBtnEl = $('refreshAllBtn');
    const exportBtnEl = $('exportBtn');
    const importBtnEl = $('importBtn');
    const restoreBtnEl = $('restoreBtn');
    const toggleAddSourceBtnEl = $('toggleAddSourceBtn');
    const addSourceSectionEl = $('addSourceSection');
    const managementPopoverEl = $('managementPopover');
    const manageToggleBtnEl = $('manageToggleBtn');

    const dragState = {
      pressTimer: null,
      armedId: '',
      draggingId: '',
      dropId: '',
      pointerId: null,
    };

    function uid() {
      return 'feed-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return (div.textContent || div.innerText || '').trim();
    }

    function getSourceHost(source) {
      try {
        return new URL(source.url).host.replace(/^www\./, '');
      } catch (error) {
        return source.url;
      }
    }

    function getSummaryItems() {
      return state.sources.flatMap((source) => {
        const items = state.itemsById[source.id] || [];
        return items.map((item) => ({ ...item, __sourceName: source.name }));
      });
    }

    function moveSource(fromId, toId) {
      if (!fromId || !toId || fromId === toId) return false;
      const fromIndex = state.sources.findIndex((item) => item.id === fromId);
      const toIndex = state.sources.findIndex((item) => item.id === toId);
      if (fromIndex < 0 || toIndex < 0) return false;
      const [moved] = state.sources.splice(fromIndex, 1);
      state.sources.splice(toIndex, 0, moved);
      saveSources();
      return true;
    }

    function resetDragState() {
      if (dragState.pressTimer) {
        clearTimeout(dragState.pressTimer);
        dragState.pressTimer = null;
      }
      dragState.armedId = '';
      dragState.draggingId = '';
      dragState.dropId = '';
      dragState.pointerId = null;
    }

    function setManagementOpen(open) {
      managementPopoverEl.classList.toggle('open', open);
      manageToggleBtnEl.classList.toggle('active', open);
      manageToggleBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function setAddSectionCollapsed(collapsed) {
      addSourceSectionEl.classList.toggle('collapsed', collapsed);
      toggleAddSourceBtnEl.textContent = '新增数据源';
      toggleAddSourceBtnEl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      if (!collapsed) setManagementOpen(true);
    }

    function normalizeSource(raw) {
      return {
        id: String(raw.id || uid()),
        name: String(raw.name || '').trim(),
        url: String(raw.url || '').trim(),
        builtin: Boolean(raw.builtin),
      };
    }

    function loadSources() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        state.sources = BUILTIN_SOURCES.map((item) => ({ ...item, builtin: true }));
        saveSources();
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        const normalized = Array.isArray(parsed) ? parsed.map(normalizeSource).filter((item) => item.name && item.url) : [];
        state.sources = normalized.length ? normalized : BUILTIN_SOURCES.map((item) => ({ ...item, builtin: true }));
      } catch (error) {
        console.error(error);
        state.sources = BUILTIN_SOURCES.map((item) => ({ ...item, builtin: true }));
      }
      saveSources();
    }

    function saveSources() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.sources));
    }

    function loadActiveId() {
      state.activeId = 'summary';
    }

    function saveActiveId() {
      if (state.activeId) localStorage.setItem(ACTIVE_KEY, state.activeId);
    }

    function setStatus(text, type = '') {
      globalStatusEl.textContent = text || '';
      globalStatusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function getActiveSource() {
      return state.sources.find((item) => item.id === state.activeId) || null;
    }

    function renderTabs() {
      const summaryActive = state.activeId === 'summary' ? ' active' : '';
      const summaryDragging = dragState.draggingId === 'summary' ? ' dragging' : '';
      const summaryArmed = dragState.armedId === 'summary' ? ' drag-armed' : '';
      const summaryDrop = dragState.dropId === 'summary' ? ' drop-target' : '';
      const summaryCount = getSummaryItems().length;
      const summaryBadge = Number.isFinite(summaryCount) ? `<span class="badge">${summaryCount}</span>` : '';
      const summaryTab = `<div class="tab tab-summary${summaryActive}${summaryDragging}${summaryArmed}${summaryDrop}" data-id="summary">
          <span class="tab-body">
            <span class="tab-topline">
              <span class="tab-name">汇总</span>
              ${summaryBadge}
            </span>
            <span class="tab-sub">全部数据源</span>
          </span>
        </div>`;

      const sourceTabs = state.sources.map((item) => {
        const count = state.itemsById[item.id]?.length;
        const active = item.id === state.activeId ? ' active' : '';
        const dragging = item.id === dragState.draggingId ? ' dragging' : '';
        const armed = item.id === dragState.armedId ? ' drag-armed' : '';
        const dropTarget = item.id === dragState.dropId ? ' drop-target' : '';
        const showActions = state.expandedTabActionsId === item.id ? ' show-actions' : '';
        const badge = Number.isFinite(count) ? `<span class="badge">${count}</span>` : '';
        const host = getSourceHost(item);
        const hideDelete = item.builtin ? ' style="display:none"' : '';
        return `<div class="tab${active}${dragging}${armed}${dropTarget}${showActions}" data-id="${escapeHtml(item.id)}">
          <span class="tab-body">
            <span class="tab-topline">
              <span class="tab-name">${escapeHtml(item.name)}</span>
              ${badge}
            </span>
            <span class="tab-sub">${escapeHtml(host)}</span>
          </span>
          <span class="tab-actions">
            <button type="button" class="tab-action-btn" data-tab-action="refresh" data-id="${escapeHtml(item.id)}">刷新</button>
            <button type="button" class="tab-action-btn danger" data-tab-action="delete" data-id="${escapeHtml(item.id)}"${hideDelete}>删除</button>
          </span>
        </div>`;
      }).join('');

      tabsEl.innerHTML = summaryTab + sourceTabs;
      if (tabsCountEl) tabsCountEl.textContent = `${state.sources.length + 1} 个视图`;
    }

    function renderFeedContent() {
      if (state.activeId === 'summary') {
        const summaryItems = getSummaryItems()
          .sort((a, b) => String(b.pubDate || b.isoDate || '').localeCompare(String(a.pubDate || a.isoDate || '')));
        feedTitleEl.textContent = '汇总';
        feedUrlEl.textContent = '全部数据源';
        feedUrlEl.removeAttribute('href');
        const failedCount = state.sources.filter((item) => state.errorById[item.id]).length;
        const loadingCount = state.sources.filter((item) => state.loadingById[item.id]).length;
        const pieces = [`共 ${state.sources.length} 个源`];
        if (loadingCount) pieces.push(`加载中 ${loadingCount} 个`);
        if (failedCount) pieces.push(`失败 ${failedCount} 个`);
        feedMetaEl.textContent = pieces.join(' ｜ ');
        if (!summaryItems.length) {
          itemsEl.innerHTML = '';
          emptyStateEl.style.display = 'block';
          emptyStateEl.textContent = loadingCount ? '正在汇总 RSS 内容...' : '暂无内容';
          return;
        }
        emptyStateEl.style.display = 'none';
        itemsEl.innerHTML = summaryItems.map((item) => {
          const summary = escapeHtml(stripHtml(item.description || item.summary || '')).slice(0, 280);
          const pubDate = item.pubDate || item.isoDate || '';
          const author = item.author || '';
          const categories = Array.isArray(item.categories) ? item.categories.slice(0, 5).join(' / ') : '';
          const sourceName = item.__sourceName || '';
          return `
            <article class="item">
              <h3><a href="${escapeHtml(item.link || '#')}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || '未命名内容')}</a></h3>
              <div class="meta">
                ${sourceName ? `<span>来源：${escapeHtml(sourceName)}</span>` : ''}
                ${pubDate ? `<span>发布时间：${escapeHtml(pubDate)}</span>` : ''}
                ${author ? `<span>作者：${escapeHtml(author)}</span>` : ''}
                ${categories ? `<span>分类：${escapeHtml(categories)}</span>` : ''}
              </div>
              <div class="summary">${summary || '暂无摘要'}</div>
            </article>
          `;
        }).join('');
        return;
      }

      const source = getActiveSource();
      if (!source) {
        feedTitleEl.textContent = '暂无数据源';
        feedUrlEl.textContent = '';
        feedUrlEl.removeAttribute('href');
        feedMetaEl.textContent = '';
        itemsEl.innerHTML = '';
        emptyStateEl.style.display = 'block';
        return;
      }

      const items = state.itemsById[source.id] || [];
      const meta = state.metaById[source.id] || {};
      const isLoading = Boolean(state.loadingById[source.id]);
      const errorText = state.errorById[source.id] || '';

      feedTitleEl.textContent = meta.title || source.name;
      feedUrlEl.textContent = source.url;
      feedUrlEl.href = source.url;

      const pieces = [];
      if (isLoading) pieces.push('加载中...');
      if (meta.fetchedAt) pieces.push('刷新时间：' + meta.fetchedAt);
      if (errorText) pieces.push('错误：' + errorText);
      feedMetaEl.textContent = pieces.join(' ｜ ');

      if (!items.length) {
        itemsEl.innerHTML = '';
        emptyStateEl.style.display = 'block';
        emptyStateEl.textContent = isLoading ? '正在加载 RSS 内容...' : (errorText ? '读取失败，请稍后重试或检查链接。' : '暂无内容');
        return;
      }

      emptyStateEl.style.display = 'none';
      itemsEl.innerHTML = items.map((item) => {
        const summary = escapeHtml(stripHtml(item.description || item.summary || '')).slice(0, 280);
        const pubDate = item.pubDate || item.isoDate || '';
        const author = item.author || '';
        const categories = Array.isArray(item.categories) ? item.categories.slice(0, 5).join(' / ') : '';
        return `
          <article class="item">
            <h3><a href="${escapeHtml(item.link || '#')}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || '未命名内容')}</a></h3>
            <div class="meta">
              ${pubDate ? `<span>发布时间：${escapeHtml(pubDate)}</span>` : ''}
              ${author ? `<span>作者：${escapeHtml(author)}</span>` : ''}
              ${categories ? `<span>分类：${escapeHtml(categories)}</span>` : ''}
            </div>
            <div class="summary">${summary || '暂无摘要'}</div>
          </article>
        `;
      }).join('');
    }

    function render() {
      renderTabs();
      renderFeedContent();
    }

    async function fetchFeed(source) {
      state.loadingById[source.id] = true;
      state.errorById[source.id] = '';
      render();
      try {
        const resp = await fetch(API_PREFIX + encodeURIComponent(source.url));
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        if (data.status !== 'ok') throw new Error(data.message || '读取 RSS 失败');
        state.itemsById[source.id] = Array.isArray(data.items) ? data.items : [];
        state.metaById[source.id] = {
          title: data.feed?.title || source.name,
          fetchedAt: new Date().toLocaleString(),
        };
      } catch (error) {
        console.error(error);
        state.itemsById[source.id] = state.itemsById[source.id] || [];
        state.errorById[source.id] = error.message || '未知错误';
      } finally {
        state.loadingById[source.id] = false;
        render();
      }
    }

    async function refreshSourceById(sourceId) {
      const source = state.sources.find((item) => item.id === sourceId);
      if (!source) return;
      setStatus(`正在刷新：${source.name}`);
      await fetchFeed(source);
      const error = state.errorById[source.id];
      setStatus(error ? `${source.name} 刷新失败：${error}` : `${source.name} 已刷新`, error ? 'error' : 'ok');
    }

    async function refreshAll() {
      if (!state.sources.length) return;
      setStatus('正在刷新全部数据源...');
      for (const source of state.sources) {
        await fetchFeed(source);
      }
      const failed = state.sources.filter((item) => state.errorById[item.id]);
      setStatus(failed.length ? `刷新完成，失败 ${failed.length} 个` : '全部刷新完成', failed.length ? 'error' : 'ok');
    }

    function addSource() {
      const name = nameInputEl.value.trim();
      const url = urlInputEl.value.trim();
      if (!name || !url) {
        setStatus('请填写名称和 RSS 链接', 'error');
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        setStatus('RSS 链接必须以 http:// 或 https:// 开头', 'error');
        return;
      }
      const exists = state.sources.some((item) => item.url === url);
      if (exists) {
        setStatus('该 RSS 链接已存在', 'error');
        return;
      }
      const source = { id: uid(), name, url, builtin: false };
      state.sources.push(source);
      state.activeId = source.id;
      saveSources();
      saveActiveId();
      nameInputEl.value = '';
      urlInputEl.value = '';
      render();
      setStatus(`已添加数据源：${name}`, 'ok');
      fetchFeed(source);
    }

    function removeSourceById(sourceId) {
      const source = state.sources.find((item) => item.id === sourceId);
      if (!source || source.builtin) return;
      const ok = window.confirm(`确定删除数据源“${source.name}”吗？`);
      if (!ok) return;
      state.sources = state.sources.filter((item) => item.id !== source.id);
      delete state.itemsById[source.id];
      delete state.loadingById[source.id];
      delete state.errorById[source.id];
      delete state.metaById[source.id];
      if (state.activeId === source.id) {
        state.activeId = state.sources[0]?.id || 'summary';
      }
      if (state.expandedTabActionsId === source.id) state.expandedTabActionsId = '';
      saveSources();
      saveActiveId();
      render();
      setStatus(`已删除：${source.name}`, 'ok');
      if (!state.sources.length) {
        feedUrlEl.textContent = '';
      }
    }

    function restoreBuiltins() {
      const existingByUrl = new Map(state.sources.map((item) => [item.url, item]));
      for (const builtin of BUILTIN_SOURCES) {
        if (!existingByUrl.has(builtin.url)) {
          state.sources.push({ ...builtin, builtin: true });
        }
      }
      if (!state.activeId) state.activeId = state.sources[0]?.id || 'summary';
      saveSources();
      saveActiveId();
      render();
      setStatus('默认内置源已恢复/补齐', 'ok');
    }

    function exportSources() {
      const payload = {
        exportedAt: new Date().toISOString(),
        sources: state.sources,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'rss-sources.json';
      a.click();
      URL.revokeObjectURL(url);
      setStatus('数据源已导出', 'ok');
    }

    async function importSourcesFromFile(file) {
      const text = await file.text();
      const data = JSON.parse(text);
      const incoming = Array.isArray(data) ? data : data.sources;
      if (!Array.isArray(incoming)) throw new Error('导入文件格式不正确');

      const merged = [...state.sources];
      const urlSet = new Set(merged.map((item) => item.url));
      for (const raw of incoming) {
        const source = normalizeSource(raw);
        if (!source.name || !source.url || urlSet.has(source.url)) continue;
        merged.push(source);
        urlSet.add(source.url);
      }
      state.sources = merged;
      if (!state.activeId) state.activeId = state.sources[0]?.id || 'summary';
      saveSources();
      saveActiveId();
      render();
      setStatus('数据源导入完成', 'ok');
    }

    function bindEvents() {
      tabsEl.addEventListener('click', (event) => {
        const actionBtn = event.target.closest('[data-tab-action]');
        if (actionBtn) {
          event.stopPropagation();
          const sourceId = actionBtn.dataset.id || '';
          const action = actionBtn.dataset.tabAction || '';
          if (!sourceId || !action) return;
          if (action === 'refresh') {
            refreshSourceById(sourceId);
          } else if (action === 'delete') {
            removeSourceById(sourceId);
          }
          return;
        }

        const button = event.target.closest('.tab');
        if (!button) return;
        const nextId = button.dataset.id || '';
        if (!nextId) return;
        const sameTab = state.activeId === nextId;
        if (nextId === 'summary') {
          state.expandedTabActionsId = '';
        } else {
          state.expandedTabActionsId = sameTab && state.expandedTabActionsId === nextId ? '' : nextId;
        }
        state.activeId = nextId;
        saveActiveId();
        render();
        const source = getActiveSource();
        if (nextId !== 'summary' && source && !state.itemsById[source.id] && !state.loadingById[source.id]) {
          fetchFeed(source);
        }
      });

      tabsEl.addEventListener('pointerdown', (event) => {
        const button = event.target.closest('.tab');
        if (!button) return;
        const tabId = button.dataset.id || '';
        if (!tabId || tabId === 'summary') return;
        if (dragState.pressTimer) clearTimeout(dragState.pressTimer);
        dragState.pointerId = event.pointerId;
        dragState.armedId = '';
        dragState.draggingId = '';
        dragState.dropId = '';
        dragState.pressTimer = setTimeout(() => {
          dragState.armedId = tabId;
          dragState.draggingId = tabId;
          dragState.dropId = tabId;
          renderTabs();
        }, 450);
      });

      tabsEl.addEventListener('pointermove', (event) => {
        if (!dragState.draggingId) return;
        const overTab = event.target.closest('.tab');
        const overId = overTab?.dataset.id || dragState.draggingId;
        if (!overId || overId === 'summary') return;
        if (dragState.dropId !== overId) {
          dragState.dropId = overId;
          renderTabs();
        }
      });

      const finishDrag = () => {
        if (!dragState.draggingId) {
          resetDragState();
          return;
        }
        const fromId = dragState.draggingId;
        const toId = dragState.dropId;
        const changed = moveSource(fromId, toId);
        resetDragState();
        render();
        if (changed) {
          setStatus('数据源顺序已更新', 'ok');
        }
      };

      tabsEl.addEventListener('pointerup', finishDrag);
      tabsEl.addEventListener('pointercancel', () => { resetDragState(); render(); });
      tabsEl.addEventListener('pointerleave', () => {
        if (!dragState.draggingId && dragState.pressTimer) {
          clearTimeout(dragState.pressTimer);
          dragState.pressTimer = null;
        }
      });

      addBtnEl.addEventListener('click', addSource);
      refreshAllBtnEl.addEventListener('click', refreshAll);
      exportBtnEl.addEventListener('click', exportSources);
      restoreBtnEl.addEventListener('click', restoreBuiltins);
      importBtnEl.addEventListener('click', () => importFileEl.click());
      toggleAddSourceBtnEl.addEventListener('click', () => {
        setAddSectionCollapsed(!addSourceSectionEl.classList.contains('collapsed'));
      });
      manageToggleBtnEl.addEventListener('click', () => {
        setManagementOpen(!managementPopoverEl.classList.contains('open'));
      });
      document.addEventListener('click', (event) => {
        if (!managementPopoverEl.classList.contains('open')) return;
        const target = event.target;
        if (managementPopoverEl.contains(target) || manageToggleBtnEl.contains(target)) return;
        setManagementOpen(false);
      });

      importFileEl.addEventListener('change', async () => {
        const file = importFileEl.files && importFileEl.files[0];
        if (!file) return;
        try {
          await importSourcesFromFile(file);
        } catch (error) {
          console.error(error);
          setStatus('导入失败：' + (error.message || '未知错误'), 'error');
        } finally {
          importFileEl.value = '';
        }
      });

      urlInputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addSource();
      });
      nameInputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addSource();
      });
    }

    async function init() {
      loadSources();
      loadActiveId();
      setAddSectionCollapsed(true);
      setManagementOpen(false);
      bindEvents();
      render();
      await refreshAll();
    }

    init();
  </script>
</body>

</html>
